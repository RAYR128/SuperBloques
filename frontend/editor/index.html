<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SuperBloques - Editor</title>
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div class="app">
<header>
	<nav class="menubar">
		<div class="menu" id="menu-file-wrap">
			<button type="button" class="menu-btn" id="menu-file">Archivo</button>
			<div class="menu-dropdown" id="menu-file-dropdown" hidden>
				<button type="button" class="menu-item" id="menu-import">Importar</button>
				<button type="button" class="menu-item" id="menu-export">Exportar</button>
				<button type="button" class="menu-item" id="menu-rom">Crear y Descargar ROM</button>
				<button type="button" class="menu-item" id="menu-publish">Publicar</button>
			</div>
		</div>
	</nav>
	<a class="logo" href="/">SuperBloques</a>
	<span class="sub">Nuevo Proyecto</span>
	<div class="header-user" id="header-user"></div>
</header>
<div class="panels">
	<aside class="panel objects-panel">
		<div class="panel-title">Area de Trabajo</div>
		<div class="tree">
			<div class="tree-group">
				<div class="tree-label">
					<span>Escena</span>
					<button type="button" class="tree-add" id="add-escena" title="Nueva escena">+</button>
				</div>
				<div id="tree-escenas"></div>
			</div>
			<div class="tree-group">
				<div class="tree-label">
					<span>Objetos</span>
					<button type="button" class="tree-add" id="add-objeto" title="Nuevo objeto">+</button>
				</div>
				<div id="tree-objetos"></div>
			</div>
			<div class="tree-group">
				<div class="tree-label">
					<span>Sonidos</span>
					<button type="button" class="tree-add" id="add-sonido" title="Nuevo sonido">+</button>
				</div>
				<div id="tree-sonidos"></div>
			</div>
			<div class="tree-group">
				<div class="tree-label">
					<span>Musica</span>
					<button type="button" class="tree-add" id="add-musica" title="Nueva musica">+</button>
				</div>
				<div id="tree-musicas"></div>
			</div>
		</div>
	</aside>
	<div class="splitter" data-split="objects" role="separator" aria-orientation="vertical" aria-label="Redimensionar area de trabajo" title="Redimensionar area de trabajo"></div>

	<aside class="panel blocks-panel" id="blocks-panel">
		<div class="categories">
			<button type="button" class="cat mocion active" data-cat="mocion">Mocion</button>
			<button type="button" class="cat animacion" data-cat="animacion">Animacion</button>
			<button type="button" class="cat capa" data-cat="capa">Capa</button>
			<button type="button" class="cat sonido" data-cat="sonido">Sonido</button>
			<button type="button" class="cat control" data-cat="control">Control</button>
			<button type="button" class="cat evento" data-cat="evento">Evento</button>
			<button type="button" class="cat variable" data-cat="variable">Variable</button>
			<button type="button" class="cat operacion" data-cat="operacion">Operacion</button>
			<button type="button" class="cat sensor" data-cat="sensor">Sensor</button>
		</div>
	</aside>
	<aside class="panel instruments-panel" id="instruments-panel" hidden>
		<div class="panel-title">
			<span>Instrumentos</span>
			<button type="button" class="tree-add" id="add-instrumento" title="Nuevo instrumento">+</button>
		</div>
		<div id="instrument-list" class="instrument-list"></div>
		<div id="instrument-form" class="instrument-form" hidden>
			<label>Sonido
				<select id="inst-sonido"></select>
			</label>
			<label>Frecuencia
				<select id="inst-nota"></select>
				<input id="inst-frecuencia" type="number" min="0" max="65535" step="1" />
			</label>
			<label class="instrument-check">
				<input id="inst-esgain" type="checkbox" />
				<span>GAIN</span>
			</label>
			<div id="inst-adsr" class="instrument-adsr">
				<label>A <select id="inst-a"></select></label>
				<label>D <select id="inst-d"></select></label>
				<label>S <select id="inst-s"></select></label>
				<label>R <select id="inst-r"></select></label>
			</div>
			<label id="inst-gain-wrap">Gain
				<input id="inst-gain" type="number" min="0" max="127" step="1" />
			</label>
			<button type="button" class="instrument-remove" id="remove-instrumento">Eliminar instrumento</button>
		</div>
	</aside>

	<main class="panel workspace-panel">
		<div class="panel-title" id="workspace-title">Bloques</div>
		<div class="workspace-body">
			<div id="blocklyDiv"></div>
			<div id="sound-detail" class="sound-detail" hidden></div>
			<div id="piano-roll" class="piano" hidden>
				<div class="piano-toolbar">
					<div id="piano-channels" class="piano-channels"></div>
					<button type="button" id="piano-delete" title="Eliminar nota">Borrar</button>
					<span id="piano-hint" class="piano-hint"></span>
				</div>
				<div id="piano-scroll" class="piano-scroll">
					<div id="piano-keys" class="piano-keys"></div>
					<div id="piano-grid" class="piano-grid"></div>
				</div>
			</div>
			<div class="splitter flyout-splitter" data-split="flyout" role="separator" aria-orientation="vertical" aria-label="Redimensionar lista de bloques" title="Redimensionar lista de bloques"></div>
		</div>
	</main>
	<div class="splitter" data-split="right" role="separator" aria-orientation="vertical" aria-label="Redimensionar panel de video" title="Redimensionar panel de video"></div>

	<aside class="panel right-panel">
		<div class="stage-wrap">
			<div class="stage-label"><span>Video</span><button type="button" class="stage-play" id="stage-play" aria-label="Reproducir" title="Reproducir"></button></div>
			<canvas id="stage" width="512" height="448" tabindex="0"></canvas>
		</div>
		<div class="debug">
			<div class="panel-title">Info</div>
			<div class="debug-body">
				<div class="dim">Editor visual</div>
				<div class="ok">[ok] proyecto en memoria</div>
			</div>
		</div>
	</aside>
</div>
</div>
<input type="file" id="menu-import-file" accept="application/json,.json" hidden>
<div id="sound-menu" class="menu-dropdown sound-menu" hidden>
	<button type="button" class="menu-item" id="sound-menu-library">Importar de la libreria</button>
	<div id="sound-library" hidden></div>
	<button type="button" class="menu-item" id="sound-menu-upload">Subir archivo</button>
</div>
<input type="file" id="sound-file" accept=".brr" hidden>
<div id="publish-modal" class="modal" hidden>
	<div class="modal-card">
		<div class="modal-title" id="publish-title">Publicar proyecto</div>
		<label class="modal-field" id="publish-name-wrap">
			<span>Nombre</span>
			<input type="text" id="publish-name" maxlength="80" />
		</label>
		<div class="modal-error" id="publish-error" hidden></div>
		<div class="modal-actions">
			<button type="button" class="modal-btn" id="publish-cancel">Cancelar</button>
			<button type="button" class="modal-btn primary" id="publish-submit">Publicar</button>
		</div>
	</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
