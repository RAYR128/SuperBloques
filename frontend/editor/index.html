<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SuperBloques - Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div class="app">
<header>
<span class="logo">SuperBloques</span>
<span class="sub">Nuevo Proyecto</span>
</header>
<div class="panels">
	<!-- 1. escena / objetos -->
	<aside class="panel objects-panel">
		<div class="panel-title">Area de Trabajo</div>
		<div class="tree">
			<div class="tree-group">
				<!-- TO-DO: implementar-->
				<div class="tree-label">Escena</div>
				<div class="tree-item active" data-item="escena-1">
					<span class="dot scene"></span>
					escena 1
				</div>
			</div>
			<div class="tree-group">
				<!-- TO-DO: implementar-->
				<div class="tree-label">Objetos</div>
				<div class="tree-item" data-item="objeto-1">
					<span class="dot"></span>
					objeto 1
				</div>
				<div class="tree-item" data-item="objeto-2">
					<span class="dot"></span>
					objeto 2
				</div>
			</div>
		</div>
	</aside>

	<!-- 2. categorias + visor de bloques -->
	<aside class="panel blocks-panel">
		<div class="categories">
			<button class="cat mocion active" data-cat="mocion">Mocion</button>
			<button class="cat animacion" data-cat="animacion">Animacion</button>
			<button class="cat sonido" data-cat="sonido">Sonido</button>
			<button class="cat control" data-cat="control">Control</button>
			<button class="cat evento" data-cat="evento">Evento</button>
			<button class="cat variable" data-cat="variable">Variable</button>
			<button class="cat operacion" data-cat="operacion">Operacion</button>
			<button class="cat sensor" data-cat="sensor">Sensor</button>
		</div>
		<div class="blocks-viewer">
			<div class="panel-title" id="cat-title">Mocion</div>
			<div class="blocks-body">
				<!-- TO-DO: implementar-->
			</div>
		</div>
	</aside>

	<!-- 3. workspace de bloques -->
	<main class="panel workspace-panel">
		<div class="panel-title">Bloques</div>
		<div class="workspace-body">
			<!-- TO-DO: implementar-->
		</div>
	</main>

	<!-- 4. canvas + debug -->
	<aside class="panel right-panel">
		<div class="stage-wrap">
			<div class="stage-label">Video</div>
			<canvas id="stage" width="512" height="448"></canvas>
		</div>
		<div class="debug">
			<div class="panel-title">Info</div>
			<div class="debug-body">
				<div class="dim">// placeholder</div>
				<div class="ok">[ok] placeholder</div>
				<div>placeholder</div>
				<div class="warn">[warn] placeholder</div>
			</div>
		</div>
	</aside>
</div>
</div>
<script src="editor.js" defer></script>
</body>
</html>
